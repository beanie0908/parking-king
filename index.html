
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주차왕 김기사</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #151923;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { margin-bottom: 8px; }
.sub { color: #bbb; margin-bottom: 18px; }
.game {
  max-width: 850px;
  margin: auto;
  padding: 12px;
  background: #252c38;
  border-radius: 18px;
}
.hud {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}
.stat {
  background: white;
  color: #222;
  border-radius: 10px;
  padding: 8px;
  font-weight: bold;
}
.stat small { display: block; color: #666; }
.stat strong { font-size: 23px; }
#score { color: #159447; }
#hits { color: #d93636; }
canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #626970;
  border-radius: 10px;
  touch-action: none;
}
.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  padding-top: 15px;
}
.help {
  font-size: 12px;
  color: #ccc;
  text-align: left;
  line-height: 1.8;
}
.pad {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 52px);
  gap: 7px;
}
.pad button {
  border: 0;
  border-radius: 12px;
  background: white;
  color: #222;
  font-size: 24px;
  font-weight: bold;
  touch-action: none;
}
.pad button:active { background: #ffd43b; }
.action {
  border: 0;
  border-radius: 10px;
  padding: 13px 22px;
  margin: 12px 4px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #ffd43b;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #090d15dd;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 5;
}
.modal {
  width: min(100%, 390px);
  padding: 25px;
  background: white;
  color: #222;
  border-radius: 18px;
}
.modal p { line-height: 1.7; color: #555; }
.hidden { display: none !important; }
@media(max-width:520px) {
  body { padding: 10px; }
  .help { width: 100%; text-align: center; }
  .controls { justify-content: center; }
}
</style>
</head>
<body>

<h1>🚗 주차왕 김기사</h1>
<p class="sub">60초 동안 최대한 많이 주차하세요!</p>

<main class="game">
  <section class="hud">
    <div class="stat">
      <small>남은 시간</small>
      <strong id="time">60</strong>
    </div>
    <div class="stat">
      <small>주차 성공</small>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <small>충돌 횟수</small>
      <strong id="hits">0</strong>
    </div>
  </section>

  <canvas id="game" width="800" height="500"></canvas>

  <section class="controls">
    <div class="help">
      키보드: 방향키 또는 WASD<br>
      ▲ 전진 · ▼ 후진 · ◀ 좌회전 · ▶ 우회전<br>
      장애물 충돌 시 3초 감점
    </div>
    <div class="pad">
      <span></span>
      <button data-key="up">▲</button>
      <span></span>
      <button data-key="left">◀</button>
      <button data-key="down">▼</button>
      <button data-key="right">▶</button>
    </div>
  </section>
</main>

<div>
  <button class="action" id="restart">처음부터 다시</button>
</div>

<div class="overlay" id="startScreen">
  <div class="modal">
    <h2>🚗 주차왕 김기사</h2>
    <p>
      제한 시간 60초 안에 주차 구역에
      자동차를 완전히 넣으세요.<br>
      충돌하면 3초가 줄어들고
      주차 성공 시 1점을 획득합니다.
    </p>
    <button class="action" id="startBtn">게임 시작</button>
  </div>
</div>

<div class="overlay hidden" id="endScreen">
  <div class="modal">
    <h2>게임 종료!</h2>
    <p id="finalText"></p>
    <button class="action" id="againBtn">다시 도전하기</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 800, H = 500;
const keys = {
  up:false, down:false, left:false, right:false
};

let car, target, cones;
let score = 0, hits = 0, time = 60;
let running = false, last = 0, raf = 0, flash = 0;

const obstacles = [
  {x:0,y:0,w:W,h:18},
  {x:0,y:H-18,w:W,h:18},
  {x:0,y:0,w:18,h:H},
  {x:W-18,y:0,w:18,h:H},
  {x:155,y:90,w:18,h:210},
  {x:320,y:18,w:18,h:125},
  {x:475,y:210,w:18,h:220},
  {x:610,y:18,w:18,h:145}
];

function makeTarget() {
  const spots = [
    {x:665,y:350,a:0},
    {x:75,y:355,a:0},
    {x:350,y:395,a:0},
    {x:690,y:95,a:Math.PI/2},
    {x:250,y:65,a:Math.PI/2}
  ];
  const s = spots[Math.floor(Math.random()*spots.length)];
  target = {x:s.x,y:s.y,w:92,h:52,a:s.a};
}

function reset() {
  cancelAnimationFrame(raf);
  score = 0;
  hits = 0;
  time = 60;
  flash = 0;

  car = {x:85,y:250,a:0,w:48,h:26,speed:0};

  cones = [
    {x:250,y:300},
    {x:390,y:170},
    {x:570,y:350},
    {x:700,y:250},
    {x:80,y:120}
  ];

  makeTarget();
  running = false;
  updateHud();
  draw();

  document.getElementById("startScreen").classList.remove("hidden");
  document.getElementById("endScreen").classList.add("hidden");
}

function updateHud() {
  document.getElementById("time").textContent =
    Math.max(0,Math.ceil(time));
  document.getElementById("score").textContent = score;
  document.getElementById("hits").textContent = hits;
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#626970";
  ctx.fillRect(0,0,W,H);

  // 도로 차선
  ctx.strokeStyle = "#ffffff25";
  ctx.lineWidth = 2;
  ctx.setLineDash([18,18]);

  for(let y=70;y<H;y+=110) {
    ctx.beginPath();
    ctx.moveTo(25,y);
    ctx.lineTo(W-25,y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 잔디 외곽
  ctx.fillStyle = "#477b42";
  ctx.fillRect(18,18,W-36,12);
  ctx.fillRect(18,H-30,W-36,12);
  ctx.fillRect(18,18,12,H-36);
  ctx.fillRect(W-30,18,12,H-36);

  // 주차 구역
  ctx.save();
  ctx.translate(target.x,target.y);
  ctx.rotate(target.a);
  ctx.fillStyle = "#ffffff12";
  ctx.fillRect(-target.w/2,-target.h/2,target.w,target.h);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 4;
  ctx.setLineDash([12,7]);
  ctx.strokeRect(-target.w/2,-target.h/2,target.w,target.h);
  ctx.setLineDash([]);
  ctx.fillStyle = "white";
  ctx.font = "bold 14px Arial";
  ctx.textAlign = "center";
  ctx.fillText("PARK",0,5);
  ctx.restore();

  // 장애물
  for(const o of obstacles) {
    ctx.fillStyle = "#252a30";
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.save();
    ctx.beginPath();
    ctx.rect(o.x,o.y,o.w,o.h);
    ctx.clip();
    ctx.strokeStyle = "#ffd43b";
    ctx.lineWidth = 8;
    for(let i=-H;i<W+H;i+=24) {
      ctx.beginPath();
      ctx.moveTo(i,o.y);
      ctx.lineTo(i+o.h,o.y+o.h);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 주황색 콘
  for(const p of cones) {
    ctx.fillStyle = "#e65c20";
    ctx.beginPath();
    ctx.moveTo(p.x,p.y-15);
    ctx.lineTo(p.x-12,p.y+12);
    ctx.lineTo(p.x+12,p.y+12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillRect(p.x-7,p.y+1,14,4);

    ctx.fillStyle = "#222";
    ctx.fillRect(p.x-14,p.y+12,28,5);
  }

  drawCar();

  if(flash>0) {
    ctx.fillStyle = "#ff333355";
    ctx.fillRect(0,0,W,H);
  }
}

function drawCar() {
  ctx.save();
  ctx.translate(car.x,car.y);
  ctx.rotate(car.a);

  // 자동차 그림자
  ctx.fillStyle = "#0005";
  ctx.fillRect(-22,-10,48,26);

  // 차체
  ctx.fillStyle = "#ffd43b";
  ctx.beginPath();
  ctx.roundRect(-24,-13,48,26,7);
  ctx.fill();

  // 앞 유리
  ctx.fillStyle = "#263746";
  ctx.beginPath();
  ctx.roundRect(-8,-10,19,20,4);
  ctx.fill();

  // 전조등
  ctx.fillStyle = "white";
  ctx.fillRect(19,-10,4,6);
  ctx.fillRect(19,4,4,6);

  // 바퀴
  ctx.fillStyle = "#222";
  ctx.fillRect(-15,-16,10,4);
  ctx.fillRect(8,-16,10,4);
  ctx.fillRect(-15,12,10,4);
  ctx.fillRect(8,12,10,4);

  ctx.restore();
}

function carCorners(x=car.x,y=car.y,a=car.a) {
  const c=Math.cos(a),s=Math.sin(a);
  const hw=car.w/2,hh=car.h/2;

  return [
    [-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]
  ].map(([px,py])=>({
    x:x+px*c-py*s,
    y:y+px*s+py*c
  }));
}

function collides() {
  const pts=carCorners();

  for(const p of pts) {
    if(p.x<28 || p.x>W-28 ||
       p.y<28 || p.y>H-28) return true;

    for(const o of obstacles.slice(4)) {
      if(p.x>o.x-3 && p.x<o.x+o.w+3 &&
         p.y>o.y-3 && p.y<o.y+o.h+3) return true;
    }
  }

  for(const cone of cones) {
    if(Math.hypot(car.x-cone.x,car.y-cone.y)<27)
      return true;
  }

  return false;
}

function insideTarget() {
  const pts=carCorners();
  const c=Math.cos(-target.a);
  const s=Math.sin(-target.a);

  return pts.every(p=>{
    const dx=p.x-target.x;
    const dy=p.y-target.y;
    const x=dx*c-dy*s;
    const y=dx*s+dy*c;

    return Math.abs(x)<target.w/2-2 &&
           Math.abs(y)<target.h/2-2;
  });
}

function hit() {
  hits++;
  time=Math.max(0,time-3);
  flash=0.22;
  car.speed=0;

  car.x=Math.max(55,Math.min(W-55,
    car.x-Math.cos(car.a)*12));
  car.y=Math.max(55,Math.min(H-55,
    car.y-Math.sin(car.a)*12));

  updateHud();
}

function update(dt) {
  if(!running) return;

  time-=dt;

  if(time<=0) {
    time=0;
    finish();
    return;
  }

  const old={
    x:car.x,y:car.y,a:car.a
  };

  const turn=(keys.left?-1:0)+(keys.right?1:0);
  const drive=(keys.up?1:0)+(keys.down?-1:0);

  if(turn) {
    car.a+=turn*2.25*dt*(drive<0?-1:1);
  }

  if(drive) car.speed+=drive*260*dt;
  else car.speed*=Math.pow(0.03,dt);

  car.speed=Math.max(-125,Math.min(190,car.speed));

  car.x+=Math.cos(car.a)*car.speed*dt;
  car.y+=Math.sin(car.a)*car.speed*dt;

  if(collides()) {
    car.x=old.x;
    car.y=old.y;
    car.a=old.a;
    hit();
  }

  if(insideTarget()) {
    score++;
    makeTarget();

    cones=cones.map(()=>({
      x:80+Math.random()*640,
      y:65+Math.random()*370
    }));
  }

  if(flash>0) flash=Math.max(0,flash-dt);

  updateHud();
}

function loop(t) {
  if(!running) return;

  const dt=Math.min(0.04,(t-last)/1000||0);
  last=t;

  update(dt);
  draw();

  if(running) raf=requestAnimationFrame(loop);
}

function start() {
  if(running) return;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");

  running=true;
  last=performance.now();
  raf=requestAnimationFrame(loop);
}

function finish() {
  running=false;
  cancelAnimationFrame(raf);
  updateHud();

  document.getElementById("finalText").textContent =
    `주차 성공 ${score}회 · 충돌 ${hits}회`;

  document.getElementById("endScreen").classList.remove("hidden");
}

// 키보드 조작
const keyMap={
  ArrowUp:"up",w:"up",W:"up",
  ArrowDown:"down",s:"down",S:"down",
  ArrowLeft:"left",a:"left",A:"left",
  ArrowRight:"right",d:"right",D:"right"
};

window.addEventListener("keydown",e=>{
  const k=keyMap[e.key];
  if(k) {
    e.preventDefault();
    keys[k]=true;
  }
});

window.addEventListener("keyup",e=>{
  const k=keyMap[e.key];
  if(k) {
    e.preventDefault();
    keys[k]=false;
  }
});

window.addEventListener("blur",()=>{
  Object.keys(keys).forEach(k=>keys[k]=false);
});

// 모바일 버튼
document.querySelectorAll("[data-key]").forEach(btn=>{
  const k=btn.dataset.key;

  const down=e=>{
    e.preventDefault();
    keys[k]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[k]=false;
  };

  btn.addEventListener("pointerdown",down);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
    btn.addEventListener(ev,up);
  });
});

// 버튼 연결
document.getElementById("startBtn")
  .addEventListener("click",start);

document.getElementById("againBtn")
  .addEventListener("click",reset);

document.getElementById("restart")
  .addEventListener("click",reset);

reset();
</script>
</body>
</html>
